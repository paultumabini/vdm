  <script>  
    function relogin({view}){      
        window.top.location.replace(view);
    }


    document.querySelector('.reset-password')?.addEventListener('click', function() { 
      
      const errorMessage = []; 
      const {fields,validate,missingField}  = inputsValidation();      

      const email = {
        re: /\S+@\S+\.\S+/,
        field: fields[0],
        invalidMessage: 'Must be a valid email format',
      }             
     
      // check form entries validity as a guard clause
      if (!validate) {        
        raiseAlert('danger', 'exclamation','circle', `Please complete all fields. ${missingField}`);
        hideAlert(3000);
        return;
      }         

      const isEmailValid = new CustomValidation(email).validate();     
       
      if(isEmailValid.message) errorMessage.push(isEmailValid.message);             
      

      if(!isEmailValid.value ){
        raiseAlert('danger', 'exclamation','circle', `${errorMessage.map(val => `<div>*${val}</div>`).join('')}`);
        hideAlert(7000);
        return;
      }    
  

       $('.reset-password').html(`<span class="spinner-pulse-btn"> <i class="fa fa-spinner fa-pulse fa-2x fa-fw mt-1"></i> </span>`) 

       google.script.run.withSuccessHandler(({view, email}) => {
        if(view === 'invalid')  {
         $('.reset-password').html('Password Reset')  
          raiseAlert('danger', 'exclamation','circle', 'No account found with that email address.');
          hideAlert(3000);
        } else {
          $('.reset-password').html('Password Reset') 
          raiseAlert('success', 'check','circle', `An email has been sent containing a link to reset the password.`);
          hideAlert(3000);
            // window.top.location.replace(view);   
        }

       }).passwordReset({email:email.field.value})
            
    })   



    
 </script>
