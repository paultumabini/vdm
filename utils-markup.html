<!-- Shared confirm-delete modal reused by edit/delete flows across sections. -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered  modal-sm" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" align="left"></h6>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
      </div>
      <div class="modal-body">
        <div align="center" class="delete-section">
          Are you sure you want to delete: <br> <span class="target-to-delete" style="color:#9698ea"></span> ?
        </div>
        <button type="button" class="btn btn-primary btn-sm mr-3 mb-3 mt-3 delete-button">Delete</button>
      </div>          
    </div>
  </div>
</div>
