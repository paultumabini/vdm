<style>
  /* Login/reset stylesheet:
   * - Full-page auth layout and loading states
   * - Input icon/eye-toggle behavior styling
   * - Alert + transition classes shared by login/reset views
   */
  * {
    padding: 0;
    margin: 0;
  }

  input:-webkit-autofill,
  input:-webkit-autofill:focus {
    transition: background-color 600000s 0s, color 600000s 0s;
  } 

   #loadSpinner {
    background: #e8f0fe;
    width: 100vw;
    height: 100vh;
    position: fixed;
    z-index: 1;
  }

  .spinner-pulse {
    position: absolute;
    top: 43%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: #3f4041;
    font-size: 12px;    
  }

  .fa-pulse {
    -webkit-animation: fa-spin 1s infinite steps(9);
    animation: fa-spin 1s infinite steps(9);
  }

  span.spinner-pulse-btn {
    position: relative;
    top: -2px;
    color: #f2afff;    
    font-size: 12px;
 }

  /* alert message */
  .alert-message {
    display: flex;
    justify-content: center;
    z-index: 1060;
  }

  .alert-messages-wrapper {
    position: fixed;
    top: 4.5%;
    width: 280px;
    font-size: .85rem;
    font-weight: 500;
    text-align: center;
    z-index: 10;
    animation: slide-in-message 300ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  }

   div.message {
    padding: 0 20px;
  }

  .alert-messages-wrapper.active {
    display: block;
  }

  .alert-danger {
    color: #721c24;
    background-color: #f8d7da;
    border-color: #ef001b !important;
    box-shadow: 0 4px 20px 0px rgb(0 0 0 / 14%), 0 7px 10px -5px rgb(244 67 54);
  }

  .alert-success {
    color: #155724;
    background-color: #d4edda;
    border-color: #009722 !important;
    box-shadow: 0 4px 20px 0px rgb(0 0 0 / 14%), 0 7px 10px -5px rgb(76 175 80 / 40%);
  }

  .alert {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 65px;
    margin-bottom: 1rem;
    border: 1px solid transparent;
    border-radius: 5px;
  }

  .alert-warning {
    color: #856404;
    background-color: #fff3cd;
    border-color: #a57c00 !important;
    box-shadow: 0 4px 20px 0px rgb(0 0 0 / 14%), 0 7px 10px -5px rgb(163 158 32 / 96%);
  }

  .fa-exclamation-circle {
    color: #d90202;
  }

  .fa-check-circle {
    color: #008000;
  }

  div.alert.alert-danger>i.fas.fa-exclamation-circle,
  div.alert.alert-warning>i.fas.fa-exclamation-triangle,
  div.alert.alert-success>i.fas.fa-check-circle {
    position: absolute;
    left: 10px;
    font-size: 1rem;
  }

  button.close {
    position: absolute;
    right: 9px;
    top: 1px;
    z-index:1061
  }


  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
      sans-serif;
    box-sizing: border-box;
    background-color: #e8f0fe;
    /* background-color: rgb(111 117 126); */
  } 

  .login-container,
  .register-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
  }

  .login-container {
    overflow: hidden;
    animation: fade-in 1.2s ease-in;
  }

  .register-container {
    overflow-y: scroll;
    overflow-x: hidden;
    animation: fade-in 1.2s ease-in;
  }

  .login-content {
    display: flex;
    width: 100%;
    height: 100vh;
    align-items: center;
    justify-content: center;
    text-align: center;
    -webkit-box-pack: center;
    -webkit-box-align: center;
  }

  form {
    width: 350px;
    overflow: auto;
    max-height: 90vh;
    max-width: 95%;
    padding: 2.5rem;
    border-radius: 0.5rem;
    box-shadow: 0px 1px 40px 10px rgb(0 0 0 / 30%);
    background: linear-gradient(316deg, rgb(130 99 161 / 87%), rgb(0 0 0)), url(https://lh3.google.com/u/0/d/1uUfFg6SxrqrVfd_YpMVhmsW9sT0RKoPY);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat; 
  }  

  .login-content img {
    height: 80px;
  }

  .login-content h2 {
    margin: 2rem 0;
    color: #cfa4f8;
    font-size: 1.5rem;
    font-weight: 300;
  }

  .login-content .input-div {
    position: relative;
    display: grid;
    grid-template-columns: 7% 93%;
    margin: 1rem 0;
    padding: 4px 0;
    border-bottom: 2px solid #cfa4f8;
  }

  .login-content .input-div.one {
    margin-top: 0;
  }

  .i {
    color: #cfa4f8;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .i i {
    transition: 0.3s;
    font-size: .85rem;
  }

  i.fa-eye,
  i.fa-eye-slash {
    position: absolute;
    right: 2px;
    top: 15px;
    color: #bab4c2;
  }

  i.fa-eye:hover,
  i.fa-eye-slash:hover {
    color: #9e9e9e;
    cursor: pointer;
  }

  i.fa-eye-slash {
    visibility: hidden;
  }

  input#show-pass {
    accent-color: #14a800;
  }

  .text-password {
    color: #6c757d;
    text-align: left;
    margin: 10px 5px;
  }

  .input-div>div {
    position: relative;
    height: 45px;
  }

  .input-div>div>h5 {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #9573ff;
    font-size: .90rem;
    transition: 0.3s;
  }

  .input-div:before,
  .input-div:after {
    content: '';
    position: absolute;
    bottom: -2px;
    width: 0%;
    height: 2px;
    background-color: #774bff;
    transition: 0.3s;
  }

  .input-div:before {
    right: 50%;
  }

  .input-div:after {
    left: 50%;
  }

  .input-div.focus:before,
  .input-div.focus:after {
    width: 50%;
  }

  .input-div.focus:before {
    width: 50%;
  }

  .input-div.focus>div>h5 {
    top: -5px;
    font-size: 0.7rem;
  }

  .input-div.focus>.i>i {
    color: #774bff;
  }

  .input-div>div>input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: none;
    padding: 5px 30px 5px 10px;
    font-size: .85rem;
    font-weight: 500;
    color: #cfa4f8;
  } 

  .input-div.pass {
    margin-bottom: 4px;
  }

  a {
    display: inherit;
    text-align: right;
    text-decoration: none;
    color: #c94dd4;
    font-size: 0.9rem;
    transition: 0.3s;

  }

  a:hover {
    cursor: pointer;
  }

  .btn {
    display: block;
    width: 100%;
    height: 2.5rem;    
    outline: none;
    border: none;
    background-color: #823dc2;
    background-image: linear-gradient(to right, #774bff, #9575f7, #774bff);
    background-size: 200%;
    font-size: .85rem;
    font-weight:500;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    margin: 3.5rem 0 2rem;
    cursor: pointer;
    transition: 0.5s;
  }

  .btn:hover {
    background-position: right;
    color: #fff;
  }
  
   .btn:focus {
    outline: none;
    box-shadow: none;
    background-color:#8908ff;
  }

  .password-reset {
    float:right;
    font-size: .85rem;
    color: #9f80ff!important;
  }

  .password-reset:hover{
    color:#cfa4f8!important;
    transition: color 300ms ease-in;
  }
  
  .relogin:hover {
     cursor: pointer;
  }

  
  @media screen and (max-width: 1050px) {

    .login-container,
    .register-container {
      grid-gap: 5rem;
    }
  }

  @media screen and (max-width: 1000px) {
    form {
      width: 300px;
      transition: all .5s ease-in-out;
    }

    .login-content h2 {
      font-size: 1.2rem;
      font-weight: 300;
      margin: 2rem 0;
    }

    .img img {
      width: 400px;
    }
  }

  @media screen and (max-width: 900px) {

    .login-container,
    .register-container {
      grid-template-columns: 1fr;
    }

    .img {
      display: none;
    }

    .login-content img {
      height: 60px;
    }

    .wave {
      display: none;
    }

    .login-content {
      justify-content: center;
    }
  }

  /* animation */
.scale-in-center{
    -webkit-animation: scale-in-center 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
      animation: scale-in-center 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;   
 }

 @-webkit-keyframes scale-in-center {
    0% {
     -webkit-transform: scale(.95);
      transform: scale(.95);
      opacity: 0;
    }

    100% {
      -webkit-transform: scale(1);
      transform: scale(1);
      opacity: 1;
    }
  }

 @-webkit-keyframes slide-in-message {
  0% {
    -webkit-transform: translateY(-600px);
    transform: translateY(-600px);
    opacity: 0;
  }
  100% {
    -webkit-transform: translateY(0);
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes slide-in-message {
  0% {
    -webkit-transform: translateY(-600px);
    transform: translateY(-600px);
    opacity: 0;
  }
  100% {
    -webkit-transform: translateY(0);
    transform: translateY(0);
    opacity: 1;
  }
}

</style>
