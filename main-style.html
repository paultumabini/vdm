<style>
  /* Main app stylesheet:
   * - Global layout/typography
   * - Sidebar/nav/content containers
   * - Data table, modal, alert, and dashboard component styling
   * - Utility classes used across dynamic view partials
   */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
      sans-serif;
    min-width: 600px;
    font-size: .85rem;
    display: flex;
    justify-content: center;
    background-color: #e8f0fe;
    /* previous bg */
  }

  /* Loading*/
  ::-webkit-input-placeholder {
    font-size: .85rem !important;
    font-style: italic !important;
  }

  #loadSpinner {
    background: linear-gradient(125deg, #556676 0%, #c59cf0f2 80%);
    width: 100%;
    height: inherit;
    position: absolute;
    z-index: 5;
    top: 0;
    left: 0;
 }

  .spinner-pulse {
    position: absolute;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #3f4041;
    font-size: 12px;
  }

  .fa-pulse {
    -webkit-animation: fa-spin 1s infinite steps(9);
    animation: fa-spin 1s infinite steps(9);
  }

  .spinner-pulse-saved {
    position: absolute;
    left: -10px;
    top: -3px;
    font-size: 10px;
    color: #c677ff;
  }

  .check-saved {
    position: absolute;
    left: 0;
    top: 3px;
  }


  /* loader  */
  .line__loader {
    height: 4px;
    position: absolute;
    transform: translateY(30px);
    overflow: hidden;
    margin: auto 0;
    width: 100%;
  }

  .line__loader:before {
    content: '';
    position: absolute;
    left: -30%;
    height: 4px;
    width: 50%;
    background-color: #5039c7;
    -webkit-animation: oneliner 1s linear infinite;
    -moz-animation: oneliner 1s linear infinite;
    animation: oneliner 1s linear infinite;
  }

  @keyframes oneliner {
    0% {
      left: -40%;
    }

    50% {
      left: 20%;
      width: 80%;
    }

    100% {
      left: 100%;
      width: 100%;
    }
  }

  /* alert message */
  .alert-message {
    display: flex;
    justify-content: center;
    z-index: 1060;
  }

  .alert-messages-wrapper {
    position: fixed;
    top: 2.5%;
    width: 290px;
    font-weight: 500;
    text-align: center;
    z-index: 10;
    animation: fade-in-message 300ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  }

  div.message {
    padding: 0 10px;
  }

  .alert-messages-wrapper.active {
    display: block;
  }

  .alert-danger {
    color: #721c24;
    background-color: #f8d7da;
    border-color: #ef001b !important;
    box-shadow: 0 4px 20px 0px rgb(0 0 0 / 14%), 0 7px 10px -5px rgb(244 67 54);
  }

  .alert-success {
    color: #155724;
    background-color: #d4edda;
    border-color: #009722 !important;
    box-shadow: 0 4px 20px 0px rgb(0 0 0 / 14%), 0 7px 10px -5px rgb(76 175 80 / 40%);
  }

  .alert {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 65px;
    margin-bottom: 1rem;
    border: 1px solid transparent;
    border-radius: 5px;
  }

  .alert-warning {
    color: #856404;
    background-color: #fff3cd;
    border-color: #a57c00 !important;
    box-shadow: 0 4px 20px 0px rgb(0 0 0 / 14%), 0 7px 10px -5px rgb(163 158 32 / 96%);
  }

  .fa-exclamation-circle {
    color: #d90202;
  }

  .fa-check-circle {
    color: #008000;
  }

  div.alert.alert-danger>i.fas.fa-exclamation-circle,
  div.alert.alert-warning>i.fas.fa-exclamation-triangle,
  div.alert.alert-success>i.fas.fa-check-circle {
    position: absolute;
    left: 10px;
    font-size: 1rem;
  }

  button.close {
    position: absolute;
    right: 9px;
    top: 1px;
    z-index: 1061
  }


  /* animation for flash message */
  @keyframes fade-in-message {
    0% {
      -webkit-transform: translateY(-1000px);
      transform: translateY(-1000px);
      opacity: 0;
    }

    100% {
      -webkit-transform: translateY(0);
      transform: translateY(0);
      opacity: 1;
    }
  }


  /* Side Bar and content*/
  .wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 65%;
    height: 95%;
    display: flex;
    text-decoration: none;
    transition: all 0.3s;
    background: linear-gradient(125deg, #556676 0%, #c59cf0 80%);
    box-shadow: 0px 4px 5px 0px rgb(134 71 218), 0 0 10px 0px rgb(113 67 168 / 50%);
    overflow: hidden;
    border-radius: 5px;    
  }

  #sidebar {
    position: absolute;
    width: 70px;
    height: 95vh;
    background: linear-gradient(135deg, rgb(34 30 39 / 93%), rgb(34 30 39 / 93%)), url(https://lh3.google.com/u/0/d/1VWDh7OsQSiVqPxMf-1VIicJN2XCLrN33);   
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: 2px 1px 20px -5px #000;
    transition: all 0.3s cubic-bezier(0.91, 0.05, 0, 0.88);
    overflow-x: hidden;
    z-index: 6;
  }

  #sidebar.active {
    width: 250px;
    margin-left: 0; 
  }
  
  #sidebar ul li {
    margin: 5px 15px;
  }

  #sidebar ul li a {
    width: 230px;
    padding: 8px 7px;
    font-size: .85rem;
    display: inline-block;
    color: #839cfd;
    text-decoration: none;
    font-weight: 500;
    text-transform: uppercase;
    margin: 3px -5px;
    border-radius: 10em;   
  }
  
  #sidebar ul.components {
    margin-top: 2.5rem;
  }
  
  #sidebar ul li a span:last-of-type {
    opacity: 0;
    transition: all .6s ease;
  }

  #sidebar.active ul li a span:last-of-type {
    opacity: 1;
    margin-left: 12px;
  }

  #sidebar ul li a span:first-of-type {
    background: linear-gradient(270deg, #774bff1a, #672fab);
    padding: 8px;
    border-radius: 50%;
  }

  #sidebar ul li a i.fa {
    display: inline-block;
    font: normal normal normal 14px/1 FontAwesome;
    font-size: 16px;
    text-rendering: auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    width: 15px;
  }

 /* hover */
   #sidebar ul li:hover {     
    cursor: pointer;    
   } 

  #sidebar ul li:hover > a > span {
    color: #fff;   
  } 

  #sidebar > ul > li:not([class^="active"]):hover::before {
    content: ' ';
    position: absolute;
    width: 220px;
    height: 35px;
    left: 15px;
    background-color: rgba(96, 51, 184, .70);
    border-radius: 10em;   
     z-index: -1;
    animation: scale-in-center-highlight  0.2s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
  }

   #sidebar > ul > li.active::before {
    content: ' ';
    position: absolute;
    width: 220px;
    height: 35px;
    left: 15px;
    background-color: rgba(96, 51, 184, .70);
    box-shadow: inset 0 4px 20px 0px rgba(0, 0, 0, .10), inset 0px 9px 15px -5px rgba(0, 188, 212, .7);
    border-bottom-left-radius: 5em;   
    border-top-left-radius: 5em;      
    transform: translateY(3px);
    z-index: -1;   
    animation:  slide-in-right-indicator  0.3s cubic-bezier(0.91, 0.05, 0, 0.88);
  }

   #sidebar.active > ul > li.active::before {  
    width: 220px;   
    box-shadow: none;
    border-radius: 10em;  
    animation: slide-in-left-highlight 0.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
  }

   #sidebar > ul > li.active > a > span{
    color: #00e3fb!important;      
  }

  #sidebar > ul > li.inactive::before {
    content: ' ';
    position: absolute;
    width: 35px;
    height: 35px;
    left: 15px;
    border-radius: 10em;      
    transform: translateY(3px);
    z-index: -1;   
    opacity: 0;
    animation: slide-out-left-highlight 0.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
  }


  .span-no-bg{   
     background: none!important;   
  }

  #sidebar.active ul li:hover a > span:first-of-type {
    background: none;
    transition: all 1s ease;       
  }

 @keyframes scale-in-center-highlight {
  0% {
    -webkit-transform: scale(0) translateY(3px);
            transform: scale(0) translateY(3px);
    opacity: 1;
  }
  100% {
    -webkit-transform: scale(1) translateY(3px);
            transform: scale(1) translateY(3px);
    opacity: 1;
  }
}


@keyframes slide-out-left-highlight {
  0% {
     width: 220px;
     background-color: rgba(96, 51, 184, .70);
     opacity: 1;
  }
   75% {   
     background-color: rgba(96, 51, 184, .70); 
     opacity: 1;
  }
  100% {
     width: 35px;    
     opacity: 0;
  }
}

@keyframes slide-in-left-highlight {
  0% {
     width: 35px;     
  }
  100% {
     width: 220px;    
  }
}

@keyframes slide-in-right-indicator {
  0% {
     border-radius: 10em;  
     box-shadow: none;
  }
  75% {
     border-radius: 10em;  
     box-shadow: none;   
  }
  100% {
     width: 55px;    
  }
  
}

  /* Progress chart */
  .circular-progress-links {
    --items: 5;
  }

  svg.dashboard.circular-progress {
    width: 80px;
  }

  .circular-progress-links {
    display: grid;
    grid-template-columns: repeat(var(--items), 1fr);
    position: relative;
    font-weight: 300;
  }

  .circular-progress-links li {
    padding: 1em;
    text-align: center;
    text-decoration: none;
    transition: all 0.5s ease-in;
  }

  .circular-progress-links .line {
    position: absolute;
    height: 2px;
    pointer-events: none;
    opacity: 0;
    bottom: 0;
    background-color: #00e3fb;
    left: var(--left, calc(100% / var(--items) * (var(--index) - 1)));
    width: var(--width, calc(100% / var(--items)));
    --index: 0;
    transition: all 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
    z-index: 1;
  }

  .circular-progress-links .line-path {
    position: absolute;
    height: 2px;
    bottom: 0;
    width: 100%;
    background-color: rgb(133 133 133 / 40%);
  }

  .single-chart {
    transition: all 3s ease-in-out;
  }

  .single-chart-hf-d-wrapper,
  .single-chart-f-i-wrapper {
    margin: auto;
  }

  .single-chart-hf-d,
  .single-chart-f-i {

    margin: 7px;
    transition: all 1s ease-in-out;
  }

  .progress-title {
    color: rgb(150 152 234 / 60%);
    text-align: center;
    font-weight: 500;
  }

  .circular-progress {
    display: block;
    margin: 10px auto;
    cursor: pointer;
    position: sticky;
  }

  .circle-bg {
    fill: none;
    stroke: rgb(85 65 104 / 80%);
    stroke-width: 3.5;
  }

  .progress {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
  }

  .progress.active {
    animation: progress 1s ease-out forwards;
  }

  @keyframes progress {
    0% {
      stroke-dasharray: 0 100;
    }
  }

  .percentage {
    fill: rgb(150 152 234 / 60%);
    font-size: .56rem;
    font-weight: 500;
    text-anchor: middle;
  }

  /* active */
  .single-chart.active>svg.circular-progress stop:nth-child(1) {
    stop-color: #b72bc7;
    transition: all 0.5s ease-in-out;
  }

  .single-chart.active>svg.circular-progress stop:nth-child(2) {
    stop-color: #00fbff;
    transition: all 0.5s ease-in-out;
  }

  .circular-progress-links li.active~.line {
    opacity: 1;
  }

  .circular-progress-links li.active>.progress-title,
  .circular-progress-links li.active .percentage {
    color: #adf;
    fill: #adf;
    transition: all 0.5s ease-in-out;
  }

  .circular-progress-links li:nth-of-type(1).active~.line {
    --index: 1;
  }

  .circular-progress-links li:nth-of-type(2).active~.line {
    --index: 2;
  }

  .circular-progress-links li:nth-of-type(3).active~.line {
    --index: 3;
  }

  .circular-progress-links li:nth-of-type(4).active~.line {
    --index: 4;
  }

  .circular-progress-links li:nth-of-type(5).active~.line {
    --index: 5;
  }

  /* #added-data-table_wrapper,
  #features-description-table_wrapper {
    -webkit-animation: scale-in-center .5s cubic-bezier(0.87, 0.12, 0.19, 0.8) both;
    animation: scale-in-center .5s cubic-bezier(0.87, 0.12, 0.19, 0.8) both;
  } */

  .scale-in-center {
    -webkit-animation: scale-in-center 1s cubic-bezier(0.87, 0.12, 0.19, 0.8) both;
    animation: scale-in-center 1s cubic-bezier(0.87, 0.12, 0.19, 0.8) both;
  }

  @-webkit-keyframes scale-in-center {
    0% {
      -webkit-transform: scale(.96);
      transform: scale(.96);
      opacity: 0;
    }

    100% {
      -webkit-transform: scale(1);
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes scale-in-center {
    0% {
      -webkit-transform: scale(.96);
      transform: scale(.96);
      opacity: 0;
    }

    100% {
      -webkit-transform: scale(1);
      transform: scale(1);
      opacity: 1;
    }
  }


  @-webkit-keyframes fade-in-left {
    0% {
      -webkit-transform: translate(-90px, 5px);
      transform: translate(-90px, 5px);
      opacity: 0;
    }

    100% {
      -webkit-transform: translate(-70px, 5px);
      transform: translate(-70px, 5px);
      opacity: 1;
    }
  }

  @keyframes fade-in-left {
    0% {
      -webkit-transform: translate(-90px, 5px);
      transform: translate(-90px, 5px);
      opacity: 0;
    }

    100% {
      -webkit-transform: translate(-70px, 5px);
      transform: translate(-70px, 5px);
      opacity: 1;
    }
  }


  .fadeOutLeft {
    -webkit-animation: fade-out-left 0.4s cubic-bezier(0.390, 0.575, 0.565, 1.000) both;
    animation: fade-out-left 0.2s cubic-bezier(0.390, 0.575, 0.565, 1.000) both;
  }

  @-webkit-keyframes fade-out-left {
    0% {
      -webkit-transform: translate(-70px, 5px);
      transform: translate(-70px, 5px);
      opacity: 1;
    }

    100% {
      -webkit-transform: translate(-90px, 5px);
      transform: translate(-90px, 5px);
      opacity: 0;
      display: none;
    }
  }

  @keyframes fade-out-left {
    0% {
      -webkit-transform: translate(-70px, 5px);
      transform: translate(-70px, 5px);
    }

    100% {
      -webkit-transform: translate(-90px, 5px);

      opacity: 0;
    }
  }
